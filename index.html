<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Generator</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Latin Letter Generator</h1>
        
        <select v-model=knot()>
            <option value="proportions[0]">Quadrado</option>
            <option value="proportions[1]">DNA</option>
        </select>
        <label>{{ knot }}</label>
    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const proportions = [
                    { name: "quadrado", cord: 24, final: 5 },
                    { name: "dna", cord: 24, final: 5 }
                ];
                const knot = proportions[0];

                return {
                    proportions,
                    knot
                }
            }
        }).mount('#app');
    </script>

</body>
</html>
